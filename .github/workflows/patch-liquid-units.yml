name: PATCH - Tekucine L input ML kalkulator

on:
  workflow_dispatch:

jobs:
  patch:
    name: Primijeni L/ML ispravku
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Primijeni ispravke
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          storage = Path('src/utils/productStorage.ts')
          text = storage.read_text(encoding='utf-8')

          # Svi tecni proizvodi unose se i cuvaju u litrima.
          replacements = {
              "id: 'algaecide',\n    title: 'Algicid',\n    defaultUnit: 'ml',\n    defaultAmount: 75,\n    defaultMinAmount: 50,\n    defaultMaxAmount: 100,": "id: 'algaecide',\n    title: 'Algicid',\n    defaultUnit: 'l',\n    defaultAmount: 0.075,\n    defaultMinAmount: 0.05,\n    defaultMaxAmount: 0.1,",
              "id: 'flocculant',\n    title: 'Flokulant',\n    defaultUnit: 'ml',\n    defaultAmount: 100,\n    defaultMinAmount: 50,\n    defaultMaxAmount: 100,": "id: 'flocculant',\n    title: 'Flokulant',\n    defaultUnit: 'l',\n    defaultAmount: 0.035,\n    defaultMinAmount: 0.02,\n    defaultMaxAmount: 0.05,",
              "id: 'crystallizer',\n    title: 'Kristal',\n    defaultUnit: 'ml',\n    defaultAmount: 50,\n    defaultMinAmount: 50,\n    defaultMaxAmount: 100,": "id: 'crystallizer',\n    title: 'Kristal',\n    defaultUnit: 'l',\n    defaultAmount: 0.03,\n    defaultMinAmount: 0.01,\n    defaultMaxAmount: 0.05,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Nije pronadjen ocekivani blok u productStorage.ts: {old[:60]}')
              text = text.replace(old, new, 1)

          # Prilikom ucitavanja postojecih podataka automatski migriraj samo tekucine
          # koje su jos sacuvane u ml: 50 ml -> 0.05 l, itd.
          marker = "export function ensureProductsDatabaseInitialized(): void {"
          migration = r'''\nfunction migrateLiquidProductsToLiters(): void {\n  try {\n    const raw = localStorage.getItem(PRODUCTS_KEY);\n    if (!raw) return;\n\n    const products = JSON.parse(raw) as UserProduct[];\n    const liquidCategories = new Set<ProductCategoryId>([\n      'ph_minus', 'algaecide', 'flocculant', 'crystallizer',\n    ]);\n    let changed = false;\n\n    for (const product of products) {\n      if (!liquidCategories.has(product.categoryId) || product.dosage.unit !== 'ml') continue;\n\n      const d = product.dosage;\n      d.minAmount = Number((d.minAmount / 1000).toFixed(6));\n      d.maxAmount = d.maxAmount != null ? Number((d.maxAmount / 1000).toFixed(6)) : d.maxAmount;\n      d.amount = Number((d.amount / 1000).toFixed(6));\n      d.calculatorAmount = Number((d.calculatorAmount / 1000).toFixed(6));\n      d.unit = 'l';\n      product.updatedAt = new Date().toISOString();\n      changed = true;\n    }\n\n    if (changed) localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));\n  } catch (err) {\n    console.error('Greška pri migraciji tečnih proizvoda u litre:', err);\n  }\n}\n'''
          if 'function migrateLiquidProductsToLiters()' not in text:
              text = text.replace(marker, migration + '\n' + marker, 1)

          # Migracija se mora izvrsiti i kada je baza vec inicijalizovana.
          needle = "  if (typeof window === 'undefined' || !window.localStorage) return;\n\n  try {"
          replacement = "  if (typeof window === 'undefined' || !window.localStorage) return;\n\n  try {\n    migrateLiquidProductsToLiters();"
          if needle not in text:
              raise SystemExit('Nije pronadjen ensureProductsDatabaseInitialized blok.')
          text = text.replace(needle, replacement, 1)

          # Zamijeni cijelu funkciju kalkulacije tako da su ulazne vrijednosti u L,
          # a rezultat kalkulatora za tecne proizvode uvijek u ml.
          start = text.index('export function calculateRequiredDose(')
          next_export = text.find('\nexport ', start + 10)
          if next_export == -1:
              raise SystemExit('Nije pronadjen kraj calculateRequiredDose funkcije.')

          new_function = r'''export function calculateRequiredDose(\n  dosage: ProductDosage,\n  poolWorkingLiters: number\n): {\n  calculatedAmount: number;\n  formattedAmount: string;\n  unit: string;\n  frequencyText: string;\n  explanation: string;\n} {\n  const calcAmount =\n    dosage.calculatorAmount ||\n    computeCalculatorAmount(dosage.minAmount || dosage.amount, dosage.maxAmount, dosage.unit) ||\n    dosage.amount ||\n    0;\n\n  const freqText = formatFrequencyLabel(dosage.frequency, dosage.frequencyDays);\n  const displayUnit = dosage.unit === 'l' ? 'ml' : dosage.unit;\n  const displayMultiplier = dosage.unit === 'l' ? 1000 : 1;\n\n  if (!poolWorkingLiters || poolWorkingLiters <= 0) {\n    const displayAmount = Number((calcAmount * displayMultiplier).toFixed(2));\n    return {\n      calculatedAmount: displayAmount,\n      formattedAmount: `${displayAmount}`,\n      unit: displayUnit,\n      frequencyText: freqText,\n      explanation: `${displayAmount} ${displayUnit} / ${dosage.targetVolume} ${dosage.volumeUnit}`,\n    };\n  }\n\n  const targetLiters = (dosage.targetVolume || 10) * 1000;\n  if (targetLiters <= 0) {\n    return {\n      calculatedAmount: 0,\n      formattedAmount: '0',\n      unit: displayUnit,\n      frequencyText: freqText,\n      explanation: 'Nevažeća zapremina za doziranje',\n    };\n  }\n\n  // calculatorAmount je uvijek u jedinici u kojoj je proizvod unesen.\n  // Za tecne proizvode ta jedinica je L, pa rezultat pretvaramo u ml samo za prikaz.\n  const rawCalculated = (poolWorkingLiters / targetLiters) * calcAmount * displayMultiplier;\n  const rounded = dosage.unit === 'tableta' || dosage.unit === 'komad'\n    ? Math.ceil(rawCalculated)\n    : Number(rawCalculated.toFixed(2));\n  const formatted = rounded.toLocaleString('de-DE', { maximumFractionDigits: 2 });\n  const poolM3 = (poolWorkingLiters / 1000).toFixed(1).replace('.0', '');\n\n  return {\n    calculatedAmount: rounded,\n    formattedAmount: formatted,\n    unit: displayUnit,\n    frequencyText: freqText,\n    explanation: `Za vaš bazen (${poolWorkingLiters.toLocaleString('de-DE')} L / ${poolM3} m³) potrebno je ${formatted} ${displayUnit} (${freqText})`,\n  };\n}\n'''
          text = text[:start] + new_function + text[next_export:]
          storage.write_text(text, encoding='utf-8')

          seed = Path('src/utils/defaultSeedProducts.ts')
          s = seed.read_text(encoding='utf-8')
          seed_repls = {
              "minAmount: 50,\n      maxAmount: 100,\n      amount: 75,\n      calculatorAmount: 75,\n      unit: 'ml',\n      targetVolume: 10,": "minAmount: 0.05,\n      maxAmount: 0.1,\n      amount: 0.075,\n      calculatorAmount: 0.075,\n      unit: 'l',\n      targetVolume: 10,",
          }
          # Only replace the first matching block (Algicid), then handle the next two explicitly.
          if seed_repls[list(seed_repls)[0]] not in s:
              raise SystemExit('Algicid seed blok nije pronadjen.')
          s = s.replace(list(seed_repls)[0], list(seed_repls.values())[0], 1)

          old_f = "minAmount: 50,\n      maxAmount: 100,\n      amount: 75,\n      calculatorAmount: 75,\n      unit: 'ml',\n      targetVolume: 10,"
          new_f = "minAmount: 0.02,\n      maxAmount: 0.05,\n      amount: 0.035,\n      calculatorAmount: 0.035,\n      unit: 'l',\n      targetVolume: 10,"
          if old_f not in s:
              raise SystemExit('Flokulant seed blok nije pronadjen.')
          s = s.replace(old_f, new_f, 1)

          new_c = "minAmount: 0.01,\n      maxAmount: 0.05,\n      amount: 0.03,\n      calculatorAmount: 0.03,\n      unit: 'l',\n      targetVolume: 10,"
          if old_f not in s:
              raise SystemExit('Kristal seed blok nije pronadjen.')
          s = s.replace(old_f, new_c, 1)

          seed.write_text(s, encoding='utf-8')
          print('L input / ML calculator patch primijenjen.')
          PY

      - name: Provjeri TypeScript izmjene
        run: |
          grep -n "defaultUnit: 'l'" src/utils/productStorage.ts
          grep -n "displayUnit" src/utils/productStorage.ts
          grep -n "migrateLiquidProductsToLiters" src/utils/productStorage.ts

      - name: Sacuvaj izmjene u Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/productStorage.ts src/utils/defaultSeedProducts.ts
          git commit -m "Fix liquid product units and calculator display"
          git push

      - name: Ukloni ovaj jednokratni patch workflow
        run: |
          git rm .github/workflows/patch-liquid-units.yml
          git commit -m "Remove one-time liquid units patch workflow"
          git push
