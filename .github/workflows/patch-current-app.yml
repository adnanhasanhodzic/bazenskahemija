name: Patch Current App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: Primijeni tražene ispravke aplikacije
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Primijeni ispravke
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'REPLACE NIJE PRONAĐEN: {path} -> {old[:100]}')
              text2 = text.replace(old, new, 1)
              p.write_text(text2, encoding='utf-8')
              print(f'OK: {path}')

          # 1) Prvo spremanje bazena više NE vraća automatski na Početnu.
          # PoolFormEditor već poziva onSave(), a roditelj prebacuje prikaz na listu bazena.
          replace_once(
              'src/components/my-pool/PoolFormEditor.tsx',
              """    setShowSuccessToast(true);\n    setTimeout(() => {\n      setShowSuccessToast(false);\n      onBack();\n    }, 500);""",
              """    setShowSuccessToast(true);\n    setTimeout(() => {\n      setShowSuccessToast(false);\n    }, 1200);"""
          )

          # 2) Delete modal mora biti montiran i dok je PoolFormEditor otvoren.
          # Ranije je MyPoolScreen imao rani return, pa se modal pojavio tek nakon Back.
          replace_once(
              'src/components/my-pool/MyPoolScreen.tsx',
              """      <PoolFormEditor\n        initialPool={mode === 'edit' ? selectedPoolForEdit : null}\n        onBack={() => {\n          if (pools.length === 0 && onBackToHome) {\n            onBackToHome();\n          } else {\n            setMode('list');\n            setSelectedPoolForEdit(null);\n          }\n        }}\n        onSave={handleSavePool}\n        onDeleteRequest={mode === 'edit' ? handleDeleteRequest : undefined}\n      />""",
              """      <PoolFormEditor\n        initialPool={mode === 'edit' ? selectedPoolForEdit : null}\n        onBack={() => {\n          if (pools.length === 0 && onBackToHome) {\n            onBackToHome();\n          } else {\n            setMode('list');\n            setSelectedPoolForEdit(null);\n          }\n        }}\n        onSave={handleSavePool}\n        onDeleteRequest={mode === 'edit' ? handleDeleteRequest : undefined}\n      />\n\n      <DeletePoolModal\n        isOpen={Boolean(poolToDelete)}\n        poolName={poolToDelete?.name || ''}\n        onConfirm={handleConfirmDelete}\n        onCancel={() => setPoolToDelete(null)}\n      />"""
          )

          # 3) Svaki proizvod dobija vlastitu olovku za brzo uređivanje doziranja.
          # Klik otvara postojeći editor proizvođača i automatski skroluje do odabranog proizvoda.
          replace_once(
              'src/components/products/MyProductsScreen.tsx',
              """                                {/* Right: Delete single product button */}\n                                <button\n                                  id={`btn-delete-product-${product.id}`}""",
              """                                {/* Right: Edit + Delete single product buttons */}\n                                <button\n                                  id={`btn-edit-product-${product.id}`}\n                                  type=\"button\"\n                                  onClick={() => {\n                                    window.location.hash = `edit-product:${product.categoryId}`;\n                                    onEditManufacturer(group.manufacturer.id);\n                                  }}\n                                  className=\"w-8 h-8 rounded-xl text-slate-400 hover:text-[#0062E3] hover:bg-blue-50 dark:hover:bg-blue-950/40 flex items-center justify-center transition-colors cursor-pointer flex-shrink-0\"\n                                  title=\"Uredi doziranje ovog proizvoda\"\n                                  aria-label=\"Uredi doziranje proizvoda\"\n                                >\n                                  <Pencil size={14} strokeWidth={2.2} />\n                                </button>\n\n                                <button\n                                  id={`btn-delete-product-${product.id}`}"""
          )

          # 4) AddProductScreen prepoznaje proizvod sa kojeg je otvoren editor i skroluje direktno do njegove kartice.
          replace_once(
              'src/components/products/AddProductScreen.tsx',
              """  // UI state\n  const [formError, setFormError] = useState<string | null>(null);""",
              """  // UI state\n  const [formError, setFormError] = useState<string | null>(null);\n\n  // Ako je editor otvoren klikom na olovku konkretnog proizvoda,\n  // odmah prikaži njegovu karticu doziranja.\n  React.useEffect(() => {\n    const hash = typeof window !== 'undefined' ? window.location.hash : '';\n    const prefix = '#edit-product:';\n    if (!hash.startsWith(prefix)) return;\n\n    const categoryId = hash.slice(prefix.length);\n    window.setTimeout(() => {\n      document.getElementById(`dosage-card-${categoryId}`)?.scrollIntoView({\n        behavior: 'smooth',\n        block: 'center',\n      });\n    }, 100);\n\n    window.history.replaceState(null, '', window.location.pathname + window.location.search);\n  }, []);"""
          )

          print('SVE ISPRAVKE USPJEŠNO PRIMIJENJENE.')

      - name: Provjeri izmjene
        run: |
          grep -n "edit-product:" src/components/products/MyProductsScreen.tsx
          grep -n "dosage-card-\${categoryId}" src/components/products/AddProductScreen.tsx
          grep -n "DeletePoolModal" src/components/my-pool/MyPoolScreen.tsx
          grep -n "setShowSuccessToast(false)" src/components/my-pool/PoolFormEditor.tsx

      - name: Sačuvaj izmjene u Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/my-pool/PoolFormEditor.tsx src/components/my-pool/MyPoolScreen.tsx src/components/products/MyProductsScreen.tsx src/components/products/AddProductScreen.tsx
          git diff --cached --quiet && { echo "Nema izmjena za commit."; exit 0; }
          git commit -m "Fix pool editing and product dosage editing"
          git push

      - name: Ukloni ovaj jednokratni patch workflow
        if: success()
        run: |
          rm -f .github/workflows/patch-current-app.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-current-app.yml
          git commit -m "Remove one-time patch workflow"
          git push
