name: Patch Calculator and Water Test UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: Primijeni UI ispravke
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Primijeni ispravke
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1. Kalkulator: ukloni kubikazu iz gornjeg headera.
          # Aktivni bazen se prikazuje jasno u kartici ispod, zajedno sa nazivom i kubikazom.
          p = Path('src/components/calculator/CalculatorScreen.tsx')
          text = p.read_text(encoding='utf-8')

          old_header = '''        {currentPool && (\n          <span className="text-xs font-extrabold px-2.5 py-1 rounded-full bg-blue-50 text-[#0062E3] border border-blue-100">\n            {formatLocalizedNumber(poolVolumeM3, 1)} m³\n          </span>\n        )}'''
          if old_header not in text:
              raise SystemExit('Kalkulator header blok nije pronađen.')
          text = text.replace(old_header, '', 1)

          # 2. Kalkulator: aktivni bazen kao naslov, a ispod naziv + kubikaža.
          old_pool_card = '''          <div\n            id="card-calculator-pool-info"\n            className="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200/90 shadow-xs flex items-center justify-between"\n          >\n            <div className="flex items-center gap-3">\n              <div className="w-10 h-10 rounded-2xl bg-blue-50 text-[#0062E3] flex items-center justify-center flex-shrink-0 border border-blue-100">\n                <Waves size={20} strokeWidth={2.2} />\n              </div>\n              <div>\n                <h2 className="text-base font-black text-[#0F172A] tracking-tight">\n                  {currentPool.name || 'Moj bazen'}\n                </h2>\n                <p className="text-xs text-slate-500 font-semibold mt-0.5">\n                  Radna zapremina:{' '}\n                  <strong className="text-slate-800 font-black">\n                    {formatLocalizedNumber(poolVolumeM3, 2)} m³\n                  </strong>{' '}\n                  <span className="text-slate-400 font-normal text-[11px]">\n                    ({currentPool.workingVolumeLiters.toLocaleString('de-DE')} L)\n                  </span>\n                </p>\n              </div>\n            </div>\n\n            <span className="px-2.5 py-1 bg-blue-50 text-[#0062E3] text-[10px] font-extrabold rounded-full border border-blue-100 uppercase tracking-wide">\n              Aktivni bazen\n            </span>\n          </div>'''
          new_pool_card = '''          <div\n            id="card-calculator-pool-info"\n            className="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200/90 shadow-xs"\n          >\n            <div className="flex items-center gap-2 mb-3">\n              <Waves size={18} strokeWidth={2.2} className="text-[#0062E3]" />\n              <span className="text-[11px] font-black uppercase tracking-wider text-[#0062E3]">\n                Aktivni bazen\n              </span>\n            </div>\n\n            <div className="flex items-center gap-3">\n              <div className="w-10 h-10 rounded-2xl bg-blue-50 text-[#0062E3] flex items-center justify-center flex-shrink-0 border border-blue-100">\n                <Waves size={20} strokeWidth={2.2} />\n              </div>\n              <div className="min-w-0">\n                <h2 className="text-base font-black text-[#0F172A] tracking-tight truncate">\n                  {currentPool.name || 'Moj bazen'}\n                </h2>\n                <p className="text-xs text-slate-500 font-semibold mt-0.5">\n                  Radna zapremina:{' '}\n                  <strong className="text-slate-800 font-black">\n                    {formatLocalizedNumber(poolVolumeM3, 2)} m³\n                  </strong>{' '}\n                  <span className="text-slate-400 font-normal text-[11px]">\n                    ({currentPool.workingVolumeLiters.toLocaleString('de-DE')} L)\n                  </span>\n                </p>\n              </div>\n            </div>\n          </div>'''
          if old_pool_card not in text:
              raise SystemExit('Kalkulator kartica aktivnog bazena nije pronađena.')
          text = text.replace(old_pool_card, new_pool_card, 1)
          p.write_text(text, encoding='utf-8')

          # 3. Test vode: idealne vrijednosti uvijek u JEDNOM redu.
          p = Path('src/components/water-test/WaterTestScreen.tsx')
          text = p.read_text(encoding='utf-8')

          old_ideal = '''          <div className="flex items-center gap-1.5">\n            <Sparkles size={15} className="text-[#0062E3] flex-shrink-0" />\n            <span className="text-[11px] font-extrabold uppercase tracking-wider text-[#0062E3]">\n              Idealne vrijednosti\n            </span>\n          </div>\n\n          <div className="flex items-center gap-3 sm:gap-4 text-xs">\n            <div className="flex items-center gap-1">\n              <span className="font-bold text-slate-600">pH:</span>\n              <strong className="font-black text-slate-900">7,2 – 7,6</strong>\n            </div>\n            <div className="w-1 h-1 rounded-full bg-slate-300" />\n            <div className="flex items-center gap-1">\n              <span className="font-bold text-slate-600">Hlor:</span>\n              <strong className="font-black text-slate-900">1,0 – 3,0 ppm</strong>\n            </div>\n          </div>'''
          new_ideal = '''          <div className="flex items-center gap-2 min-w-0 w-full whitespace-nowrap overflow-hidden">\n            <Sparkles size={14} className="text-[#0062E3] flex-shrink-0" />\n            <span className="text-[10px] font-extrabold uppercase tracking-wide text-[#0062E3] flex-shrink-0">\n              Idealne vrijednosti:\n            </span>\n            <span className="text-[11px] font-bold text-slate-600 flex-shrink-0">pH:</span>\n            <strong className="text-[11px] font-black text-slate-900 flex-shrink-0">7,2 – 7,6</strong>\n            <span className="text-slate-300 flex-shrink-0">•</span>\n            <span className="text-[11px] font-bold text-slate-600 flex-shrink-0">Hlor:</span>\n            <strong className="text-[11px] font-black text-slate-900 flex-shrink-0">1,0 – 3,0 ppm</strong>\n          </div>'''
          if old_ideal not in text:
              raise SystemExit('Blok Idealne vrijednosti nije pronađen.')
          text = text.replace(old_ideal, new_ideal, 1)
          p.write_text(text, encoding='utf-8')

          print('UI ISPRAVKE USPJEŠNO PRIMIJENJENE.')

      - name: Provjeri izmjene
        run: |
          grep -n "Aktivni bazen" src/components/calculator/CalculatorScreen.tsx
          grep -n "Idealne vrijednosti:" src/components/water-test/WaterTestScreen.tsx

      - name: Sačuvaj izmjene u Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/calculator/CalculatorScreen.tsx src/components/water-test/WaterTestScreen.tsx
          git commit -m "Improve active pool and water test UI"
          git push

      - name: Ukloni jednokratni patch workflow
        if: success()
        run: |
          rm -f .github/workflows/patch-calculator-water-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-calculator-water-ui.yml
          git commit -m "Remove one-time UI patch workflow"
          git push
