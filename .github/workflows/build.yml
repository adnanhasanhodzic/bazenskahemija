name: Build Bazenska Hemija APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Postavi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Provjeri verzije
        run: |
          echo "=== Node ==="
          node --version
          echo "=== NPM ==="
          npm --version
          echo "=== Java ==="
          java -version

      - name: Instaliraj pakete
        run: npm install

      - name: Osiguraj Capacitor Android
        run: |
          npm install --save-exact @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2
          npm install --save-dev --save-exact @capacitor/assets@3.0.5

      - name: Napravi web build
        run: npm run build

      - name: Dodaj Android platformu
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Pripremi logo
        run: |
          mkdir -p assets

          if [ -f "src/assets/MB-LOGO.png" ]; then
            echo "Pronađen MB-LOGO.png"
            cp "src/assets/MB-LOGO.png" "assets/icon.png"
            cp "src/assets/MB-LOGO.png" "assets/logo.png"
          else
            echo "GREŠKA: src/assets/MB-LOGO.png nije pronađen!"
            find src -iname "*logo*" -type f
            exit 1
          fi

      - name: Generiši Android launcher ikone
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#0B8FF5' \
            --iconBackgroundColorDark '#0B8FF5'

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi Android fullscreen i swipe-reveal navigaciju
        shell: bash
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "GREŠKA: MainActivity.java nije pronađen."
            find android/app/src/main/java -type f -maxdepth 10 -print
            exit 1
          fi

          echo "MainActivity: $MAIN_ACTIVITY"
          PACKAGE_LINE=$(grep '^package ' "$MAIN_ACTIVITY" | head -1)

          cat > "$MAIN_ACTIVITY" <<EOF
          $PACKAGE_LINE

          import android.graphics.Color;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          public class MainActivity extends BridgeActivity {

            private void applyImmersiveFullscreen() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

              getWindow().setStatusBarColor(Color.TRANSPARENT);
              getWindow().setNavigationBarColor(Color.TRANSPARENT);

              if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {
                getWindow().setStatusBarContrastEnforced(false);
                getWindow().setNavigationBarContrastEnforced(false);
              }

              WindowInsetsControllerCompat controller =
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());

              controller.setSystemBarsBehavior(
                  WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              );

              controller.hide(WindowInsetsCompat.Type.systemBars());
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              applyImmersiveFullscreen();
            }

            @Override
            public void onResume() {
              super.onResume();
              applyImmersiveFullscreen();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                applyImmersiveFullscreen();
              }
            }
          }
          EOF

      - name: Sinhronizuj Android konfiguraciju
        run: npx cap sync android

      - name: Provjeri Gradle i Java konfiguraciju
        working-directory: android
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Gradle ==="
          ./gradlew --version

      - name: Napravi debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Provjeri APK
        run: |
          echo "=== Generisani APK ==="
          find android/app/build/outputs/apk -type f -name "*.apk" -print
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "=== Veličina APK-a ==="
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Sačuvaj APK kao Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bazenska-Hemija-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
