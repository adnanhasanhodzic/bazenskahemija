name: PATCH - Bazeni i proizvodi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Primijeni popravke
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) PoolFormEditor: save must NOT call onBack after save; delete confirmation must appear immediately.
          p = Path('src/components/my-pool/PoolFormEditor.tsx')
          s = p.read_text()
          s = s.replace(
              "import { Pool, PoolShape } from '../../types/pool';\n",
              "import { Pool, PoolShape } from '../../types/pool';\nimport { DeletePoolModal } from './DeletePoolModal';\n"
          )
          s = s.replace(
              "  const [showSuccessToast, setShowSuccessToast] = useState<boolean>(false);\n",
              "  const [showSuccessToast, setShowSuccessToast] = useState<boolean>(false);\n  const [showDeleteConfirm, setShowDeleteConfirm] = useState<boolean>(false);\n"
          )
          old = """    setShowSuccessToast(true);\n    setTimeout(() => {\n      setShowSuccessToast(false);\n      onBack();\n    }, 500);\n"""
          if old not in s:
              raise SystemExit('PoolFormEditor: save block not found')
          s = s.replace(old, "    setShowSuccessToast(true);\n", 1)
          s = s.replace(
              "onClick={() => onDeleteRequest(initialPool)}",
              "onClick={() => setShowDeleteConfirm(true)}"
          )
          marker = """    </div>\n  );\n};\n"""
          modal = """      <DeletePoolModal\n        isOpen={showDeleteConfirm}\n        poolName={initialPool?.name || ''}\n        onCancel={() => setShowDeleteConfirm(false)}\n        onConfirm={() => {\n          setShowDeleteConfirm(false);\n          if (initialPool && onDeleteRequest) {\n            onDeleteRequest(initialPool);\n          }\n        }}\n      />\n    </div>\n  );\n};\n"""
          if marker not in s:
              raise SystemExit('PoolFormEditor: component end marker not found')
          s = s.replace(marker, modal, 1)
          p.write_text(s)

          # 2) New individual product editor. It edits ONLY the selected product.
          edit_path = Path('src/components/products/EditProductScreen.tsx')
          edit_path.write_text(r'''import React, { useMemo, useState } from 'react';
import { ArrowLeft, Check } from 'lucide-react';
import { UserProduct, DosageFrequency, DosageType, PhCorrectionDirection, DosageUnit } from '../../types/product';
import { getSavedUserProducts, computeCalculatorAmount, computePhEffectAverage } from '../../utils/productStorage';
import { ProductIcon } from './ProductIcons';

interface EditProductScreenProps {
  productId: string;
  onSave: () => void;
  onBack: () => void;
}

const units: DosageUnit[] = ['g', 'kg', 'ml', 'l', 'tableta', 'komad'];
const frequencies: { value: DosageFrequency; label: string }[] = [
  { value: 'once', label: 'Jednokratno' },
  { value: 'daily', label: 'Dnevno' },
  { value: 'weekly', label: 'Sedmično' },
  { value: 'custom_days', label: 'Svaka X dana' },
];

export const EditProductScreen: React.FC<EditProductScreenProps> = ({ productId, onSave, onBack }) => {
  const product = useMemo<UserProduct | null>(() => {
    return getSavedUserProducts().find((p) => p.id === productId) || null;
  }, [productId]);

  const [minAmount, setMinAmount] = useState<string>(() => product ? String(product.dosage.minAmount ?? product.dosage.amount ?? '') : '');
  const [maxAmount, setMaxAmount] = useState<string>(() => product?.dosage.maxAmount != null ? String(product.dosage.maxAmount) : '');
  const [unit, setUnit] = useState<DosageUnit>(() => product?.dosage.unit || 'g');
  const [targetVolume, setTargetVolume] = useState<string>(() => product ? String(product.dosage.targetVolume || 10) : '10');
  const [frequency, setFrequency] = useState<DosageFrequency>(() => product?.dosage.frequency || 'weekly');
  const [frequencyDays, setFrequencyDays] = useState<string>(() => String(product?.dosage.frequencyDays || 7));
  const [dosageType, setDosageType] = useState<DosageType>(() => product?.dosage.dosageType || 'standard');
  const [phDirection, setPhDirection] = useState<PhCorrectionDirection>(() => product?.dosage.phDirection || 'decrease');
  const [phEffectMin, setPhEffectMin] = useState<string>(() => product?.dosage.phEffectMin != null ? String(product.dosage.phEffectMin) : '');
  const [phEffectMax, setPhEffectMax] = useState<string>(() => product?.dosage.phEffectMax != null ? String(product.dosage.phEffectMax) : '');
  const [error, setError] = useState<string>('');

  if (!product) {
    return <div className="p-6 text-sm text-slate-600">Proizvod nije pronađen.</div>;
  }

  const save = () => {
    const min = Number(minAmount);
    const max = maxAmount.trim() === '' ? null : Number(maxAmount);
    const target = Number(targetVolume);
    if (!Number.isFinite(min) || min <= 0 || (max !== null && (!Number.isFinite(max) || max <= 0)) || !Number.isFinite(target) || target <= 0) {
      setError('Unesite ispravne vrijednosti doziranja.');
      return;
    }
    if (max !== null && max < min) {
      setError('Maksimalna vrijednost ne može biti manja od minimalne.');
      return;
    }

    let phMin: number | undefined;
    let phMax: number | undefined;
    if (dosageType === 'ph_correction') {
      phMin = Number(phEffectMin);
      phMax = phEffectMax.trim() === '' ? undefined : Number(phEffectMax);
      if (!Number.isFinite(phMin) || phMin <= 0 || (phMax !== undefined && (!Number.isFinite(phMax) || phMax <= 0))) {
        setError('Unesite ispravan učinak na pH.');
        return;
      }
    }

    const all = getSavedUserProducts();
    const updated = all.map((p) => {
      if (p.id !== product.id) return p;
      const calc = computeCalculatorAmount(min, max, unit);
      const nextDosage = {
        ...p.dosage,
        dosageType,
        minAmount: min,
        maxAmount: max,
        amount: calc,
        calculatorAmount: calc,
        unit,
        targetVolume: target,
        volumeUnit: 'm³' as const,
        frequency,
        frequencyDays: frequency === 'custom_days' ? (Number(frequencyDays) || 7) : undefined,
        phDirection: dosageType === 'ph_correction' ? phDirection : undefined,
        phEffectMin: dosageType === 'ph_correction' ? phMin : undefined,
        phEffectMax: dosageType === 'ph_correction' ? phMax : undefined,
        phEffectAverage: dosageType === 'ph_correction' ? computePhEffectAverage(phMin, phMax ?? null) : undefined,
      };
      return { ...p, dosage: nextDosage, updatedAt: new Date().toISOString() };
    });
    localStorage.setItem('moj_bazen_user_products', JSON.stringify(updated));
    onSave();
  };

  return (
    <div className="w-full min-h-full flex flex-col bg-[#F8FAFC] pb-20 select-none">
      <header className="sticky top-0 z-30 bg-white/95 px-4 py-3 flex items-center justify-between border-b border-slate-100 shadow-xs">
        <div className="flex items-center gap-3">
          <button type="button" onClick={onBack} className="w-9 h-9 -ml-1 rounded-full flex items-center justify-center text-slate-800 hover:bg-slate-100 cursor-pointer" aria-label="Nazad">
            <ArrowLeft size={22} strokeWidth={2.4} />
          </button>
          <div>
            <h1 className="text-lg font-bold text-[#0F172A]">Uredi proizvod</h1>
            <p className="text-[11px] text-slate-400">Samo ovaj proizvod</p>
          </div>
        </div>
        <button type="button" onClick={save} className="w-9 h-9 rounded-full flex items-center justify-center text-[#0062E3] hover:bg-blue-50 cursor-pointer" aria-label="Spremi">
          <Check size={24} strokeWidth={3} />
        </button>
      </header>

      <div className="px-5 py-4 max-w-md mx-auto w-full space-y-4">
        <div className="bg-white rounded-3xl border border-slate-200 p-4 shadow-xs">
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-center"><ProductIcon categoryId={product.categoryId} size={34} /></div>
            <div>
              <h2 className="text-base font-black text-[#0F172A]">{product.customTitle || product.categoryTitle}</h2>
              <p className="text-xs font-semibold text-slate-500">{product.manufacturerName}</p>
            </div>
          </div>
        </div>

        <section className="bg-white rounded-3xl border border-slate-200 p-4 space-y-4">
          <h2 className="text-sm font-black text-[#0F172A]">Vrijednost doziranja</h2>
          <div className="grid grid-cols-[1fr_auto_1fr_110px] gap-2 items-center">
            <input value={minAmount} onChange={(e) => setMinAmount(e.target.value)} inputMode="decimal" className="w-full py-3 px-3 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <span className="text-slate-400 font-bold">do</span>
            <input value={maxAmount} onChange={(e) => setMaxAmount(e.target.value)} inputMode="decimal" placeholder="nije obavezno" className="w-full py-3 px-3 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <select value={unit} onChange={(e) => setUnit(e.target.value as DosageUnit)} className="w-full py-3 px-2 rounded-xl border border-slate-200 font-semibold bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              {units.map((u) => <option key={u} value={u}>{u}</option>)}
            </select>
          </div>

          <label className="block text-xs font-bold text-slate-600">Na zapreminu</label>
          <div className="flex">
            <input value={targetVolume} onChange={(e) => setTargetVolume(e.target.value)} inputMode="decimal" className="flex-1 py-3 px-3 rounded-l-xl border border-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <div className="px-4 py-3 bg-slate-100 border border-l-0 border-slate-200 rounded-r-xl font-bold text-slate-600">m³</div>
          </div>

          <label className="block text-xs font-bold text-slate-600">Učestalost</label>
          <select value={frequency} onChange={(e) => setFrequency(e.target.value as DosageFrequency)} className="w-full py-3 px-3 rounded-xl border border-slate-200 font-semibold bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            {frequencies.map((f) => <option key={f.value} value={f.value}>{f.label}</option>)}
          </select>
          {frequency === 'custom_days' && (
            <input value={frequencyDays} onChange={(e) => setFrequencyDays(e.target.value)} inputMode="numeric" placeholder="Broj dana" className="w-full py-3 px-3 rounded-xl border border-slate-200 font-semibold" />
          )}
        </section>

        <section className="bg-white rounded-3xl border border-slate-200 p-4 space-y-4">
          <h2 className="text-sm font-black text-[#0F172A]">Tip doziranja / djelovanja</h2>
          <select value={dosageType} onChange={(e) => setDosageType(e.target.value as DosageType)} className="w-full py-3 px-3 rounded-xl border border-slate-200 font-semibold bg-white">
            <option value="standard">Standardno doziranje</option>
            <option value="ph_correction">Korekcija pH</option>
          </select>
          {dosageType === 'ph_correction' && (
            <>
              <select value={phDirection} onChange={(e) => setPhDirection(e.target.value as PhCorrectionDirection)} className="w-full py-3 px-3 rounded-xl border border-slate-200 font-semibold bg-white">
                <option value="decrease">Smanjuje pH</option>
                <option value="increase">Povećava pH</option>
              </select>
              <div className="grid grid-cols-2 gap-2">
                <input value={phEffectMin} onChange={(e) => setPhEffectMin(e.target.value)} inputMode="decimal" placeholder="pH min" className="py-3 px-3 rounded-xl border border-slate-200 font-semibold" />
                <input value={phEffectMax} onChange={(e) => setPhEffectMax(e.target.value)} inputMode="decimal" placeholder="pH max" className="py-3 px-3 rounded-xl border border-slate-200 font-semibold" />
              </div>
            </>
          )}
        </section>

        {error && <div className="rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold p-3">{error}</div>}
        <button type="button" onClick={save} className="w-full py-3.5 rounded-2xl bg-[#0062E3] text-white font-extrabold text-sm shadow-md cursor-pointer">Sačuvaj promjene</button>
      </div>
    </div>
  );
};
''')

          # 3) App: add individual product editor state, screen and navigation cleanup.
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("import { AddProductScreen } from './components/products/AddProductScreen';\n", "import { AddProductScreen } from './components/products/AddProductScreen';\nimport { EditProductScreen } from './components/products/EditProductScreen';\n")
          s = s.replace("  const [editingManufacturerId, setEditingManufacturerId] = useState<string | null>(null);\n", "  const [editingManufacturerId, setEditingManufacturerId] = useState<string | null>(null);\n  const [editingProductId, setEditingProductId] = useState<string | null>(null);\n")
          s = s.replace("    setEditingManufacturerId(null);\n    setActiveTab(tab);\n", "    setEditingManufacturerId(null);\n    setEditingProductId(null);\n    setActiveTab(tab);\n")
          s = s.replace("    setEditingManufacturerId(null);\n    setActiveTab('home');\n", "    setEditingManufacturerId(null);\n    setEditingProductId(null);\n    setActiveTab('home');\n")
          s = s.replace("  const handleSaveProducts = () => {\n    setProductEditorMode(null);\n    setEditingManufacturerId(null);\n  };\n", "  const handleSaveProducts = () => {\n    setProductEditorMode(null);\n    setEditingManufacturerId(null);\n    setEditingProductId(null);\n  };\n\n  const handleSaveEditedProduct = () => {\n    setEditingProductId(null);\n  };\n")
          old = '''              {activeTab === 'my-products' && (\n                productEditorMode ? (\n                  <AddProductScreen\n                    editingManufacturerId={editingManufacturerId}\n                    onSave={handleSaveProducts}\n                    onBack={() => {\n                      setProductEditorMode(null);\n                      setEditingManufacturerId(null);\n                    }}\n                  />\n                ) : (\n                  <MyProductsScreen\n                    onAddNewProduct={() => {\n                      setEditingManufacturerId(null);\n                      setProductEditorMode('add');\n                    }}\n                    onEditManufacturer={(mfgId) => {\n                      setEditingManufacturerId(mfgId);\n                      setProductEditorMode('edit');\n                    }}\n                    onBack={handleBackToHome}\n                  />\n                )\n              )}\n'''
          new = '''              {activeTab === 'my-products' && (\n                editingProductId ? (\n                  <EditProductScreen\n                    productId={editingProductId}\n                    onSave={handleSaveEditedProduct}\n                    onBack={() => setEditingProductId(null)}\n                  />\n                ) : productEditorMode ? (\n                  <AddProductScreen\n                    editingManufacturerId={editingManufacturerId}\n                    onSave={handleSaveProducts}\n                    onBack={() => {\n                      setProductEditorMode(null);\n                      setEditingManufacturerId(null);\n                    }}\n                  />\n                ) : (\n                  <MyProductsScreen\n                    onAddNewProduct={() => {\n                      setEditingManufacturerId(null);\n                      setEditingProductId(null);\n                      setProductEditorMode('add');\n                    }}\n                    onEditManufacturer={(mfgId) => {\n                      setEditingManufacturerId(mfgId);\n                      setEditingProductId(null);\n                      setProductEditorMode('edit');\n                    }}\n                    onEditProduct={(productId) => {\n                      setEditingProductId(productId);\n                      setProductEditorMode(null);\n                    }}\n                    onBack={handleBackToHome}\n                  />\n                )\n              )}\n'''
          if old not in s:
              raise SystemExit('App: my-products block not found')
          s = s.replace(old, new)
          s = s.replace("{!productEditorMode && (\n              <BottomNav", "{!productEditorMode && !editingProductId && (\n              <BottomNav")
          p.write_text(s)

          # 4) MyProductsScreen: expose per-product edit action.
          p = Path('src/components/products/MyProductsScreen.tsx')
          s = p.read_text()
          s = s.replace(
              "  onEditManufacturer: (manufacturerId: string) => void;\n  onBack?: () => void;",
              "  onEditManufacturer: (manufacturerId: string) => void;\n  onEditProduct: (productId: string) => void;\n  onBack?: () => void;"
          )
          s = s.replace(
              "  onEditManufacturer,\n  onBack,",
              "  onEditManufacturer,\n  onEditProduct,\n  onBack,"
          )
          old_btn = '''                                {/* Right: Delete single product button */}\n                                <button\n                                  id={`btn-delete-product-${product.id}`}\n                                  type="button"\n                                  onClick={() => setProductToDelete(product)}\n                                  className="w-8 h-8 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 flex items-center justify-center transition-colors cursor-pointer flex-shrink-0"\n                                  title="Obriši ovaj proizvod"\n                                >\n                                  <Trash2 size={14} strokeWidth={2.2} />\n                                </button>\n'''
          new_btn = '''                                {/* Right: Edit + Delete single product buttons */}\n                                <div className="flex items-center gap-1 flex-shrink-0">\n                                  <button\n                                    id={`btn-edit-product-${product.id}`}\n                                    type="button"\n                                    onClick={() => onEditProduct(product.id)}\n                                    className="w-8 h-8 rounded-xl text-slate-400 hover:text-[#0062E3] hover:bg-blue-50 dark:hover:bg-blue-950/40 flex items-center justify-center transition-colors cursor-pointer"\n                                    title="Uredi ovaj proizvod"\n                                  >\n                                    <Pencil size={14} strokeWidth={2.2} />\n                                  </button>\n                                  <button\n                                    id={`btn-delete-product-${product.id}`}\n                                    type="button"\n                                    onClick={() => setProductToDelete(product)}\n                                    className="w-8 h-8 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 flex items-center justify-center transition-colors cursor-pointer"\n                                    title="Obriši ovaj proizvod"\n                                  >\n                                    <Trash2 size={14} strokeWidth={2.2} />\n                                  </button>\n                                </div>\n'''
          if old_btn not in s:
              raise SystemExit('MyProductsScreen: product button block not found')
          s = s.replace(old_btn, new_btn)
          p.write_text(s)

          print('All requested application fixes applied.')
          PY

      - name: Provjeri TypeScript
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Sacuvaj izmjene u Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/my-pool/PoolFormEditor.tsx src/components/products/MyProductsScreen.tsx src/components/products/EditProductScreen.tsx
          git commit -m "Fix pool save delete and individual product editing"
          git push

      - name: Ukloni ovaj privremeni patch workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/patch-fixes.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary patch workflow" || true
          git push || true
