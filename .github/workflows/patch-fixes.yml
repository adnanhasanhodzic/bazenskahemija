name: One-time repair - Bazeni i proizvodi

on:
  push:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Primijeni ispravke i ukloni patch workflowe
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'NIJE PRONADJEN BLOK: {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print(f'OK {path}')

          replace_once('src/components/my-pool/PoolFormEditor.tsx', '''    setShowSuccessToast(true);\n    setTimeout(() => {\n      setShowSuccessToast(false);\n      onBack();\n    }, 500);''', '''    setShowSuccessToast(true);\n    setTimeout(() => {\n      setShowSuccessToast(false);\n    }, 1200);''')

          replace_once('src/components/my-pool/MyPoolScreen.tsx', '''    return (\n      <PoolFormEditor\n        initialPool={mode === 'edit' ? selectedPoolForEdit : null}\n        onBack={() => {\n          if (pools.length === 0 && onBackToHome) {\n            onBackToHome();\n          } else {\n            setMode('list');\n            setSelectedPoolForEdit(null);\n          }\n        }}\n        onSave={handleSavePool}\n        onDeleteRequest={mode === 'edit' ? handleDeleteRequest : undefined}\n      />\n    );''', '''    return (\n      <>\n        <PoolFormEditor\n          initialPool={mode === 'edit' ? selectedPoolForEdit : null}\n          onBack={() => {\n            if (pools.length === 0 && onBackToHome) {\n              onBackToHome();\n            } else {\n              setMode('list');\n              setSelectedPoolForEdit(null);\n            }\n          }}\n          onSave={handleSavePool}\n          onDeleteRequest={mode === 'edit' ? handleDeleteRequest : undefined}\n        />\n        <DeletePoolModal\n          isOpen={Boolean(poolToDelete)}\n          poolName={poolToDelete?.name || ''}\n          onConfirm={handleConfirmDelete}\n          onCancel={() => setPoolToDelete(null)}\n        />\n      </>\n    );''')

          replace_once('src/components/products/MyProductsScreen.tsx', '''interface MyProductsScreenProps {\n  onAddNewProduct: () => void;\n  onEditManufacturer: (manufacturerId: string) => void;\n  onBack?: () => void;\n}''', '''interface MyProductsScreenProps {\n  onAddNewProduct: () => void;\n  onEditManufacturer: (manufacturerId: string) => void;\n  onEditProduct: (categoryId: string) => void;\n  onBack?: () => void;\n}''')
          replace_once('src/components/products/MyProductsScreen.tsx', '''export const MyProductsScreen: React.FC<MyProductsScreenProps> = ({\n  onAddNewProduct,\n  onEditManufacturer,\n  onBack,\n}) => {''', '''export const MyProductsScreen: React.FC<MyProductsScreenProps> = ({\n  onAddNewProduct,\n  onEditManufacturer,\n  onEditProduct,\n  onBack,\n}) => {''')
          replace_once('src/components/products/MyProductsScreen.tsx', '''                                {/* Right: Delete single product button */}\n                                <button\n                                  id={`btn-delete-product-${product.id}`}''', '''                                {/* Right: Edit + Delete single product buttons */}\n                                <button\n                                  id={`btn-edit-product-${product.id}`}\n                                  type="button"\n                                  onClick={() => onEditProduct(product.categoryId)}\n                                  className="w-8 h-8 rounded-xl text-slate-400 hover:text-[#0062E3] hover:bg-blue-50 dark:hover:bg-blue-950/40 flex items-center justify-center transition-colors cursor-pointer flex-shrink-0"\n                                  title="Uredi doziranje ovog proizvoda"\n                                  aria-label="Uredi doziranje proizvoda"\n                                >\n                                  <Pencil size={14} strokeWidth={2.2} />\n                                </button>\n\n                                {/* Right: Delete single product button */}\n                                <button\n                                  id={`btn-delete-product-${product.id}`}''')

          replace_once('src/App.tsx', '''  const [productEditorMode, setProductEditorMode] = useState<'add' | 'edit' | null>(null);\n  const [editingManufacturerId, setEditingManufacturerId] = useState<string | null>(null);''', '''  const [productEditorMode, setProductEditorMode] = useState<'add' | 'edit' | null>(null);\n  const [editingManufacturerId, setEditingManufacturerId] = useState<string | null>(null);\n  const [focusProductCategoryId, setFocusProductCategoryId] = useState<string | null>(null);''')
          replace_once('src/App.tsx', '''    setProductEditorMode(null);\n    setEditingManufacturerId(null);\n    setActiveTab(tab);''', '''    setProductEditorMode(null);\n    setEditingManufacturerId(null);\n    setFocusProductCategoryId(null);\n    setActiveTab(tab);''')
          replace_once('src/App.tsx', '''    setProductEditorMode(null);\n    setEditingManufacturerId(null);\n    setActiveTab('home');''', '''    setProductEditorMode(null);\n    setEditingManufacturerId(null);\n    setFocusProductCategoryId(null);\n    setActiveTab('home');''')
          replace_once('src/App.tsx', '''  const handleSaveProducts = () => {\n    setProductEditorMode(null);\n    setEditingManufacturerId(null);\n  };''', '''  const handleSaveProducts = () => {\n    setProductEditorMode(null);\n    setEditingManufacturerId(null);\n    setFocusProductCategoryId(null);\n  };''')
          replace_once('src/App.tsx', '''                  <AddProductScreen\n                    editingManufacturerId={editingManufacturerId}''', '''                  <AddProductScreen\n                    editingManufacturerId={editingManufacturerId}\n                    focusProductCategoryId={focusProductCategoryId}''')
          replace_once('src/App.tsx', '''                  <MyProductsScreen\n                    onAddNewProduct={() => {\n                      setEditingManufacturerId(null);\n                      setProductEditorMode('add');\n                    }}\n                    onEditManufacturer={(mfgId) => {\n                      setEditingManufacturerId(mfgId);\n                      setProductEditorMode('edit');\n                    }}''', '''                  <MyProductsScreen\n                    onAddNewProduct={() => {\n                      setEditingManufacturerId(null);\n                      setFocusProductCategoryId(null);\n                      setProductEditorMode('add');\n                    }}\n                    onEditManufacturer={(mfgId) => {\n                      setEditingManufacturerId(mfgId);\n                      setFocusProductCategoryId(null);\n                      setProductEditorMode('edit');\n                    }}\n                    onEditProduct={(categoryId) => {\n                      const products = getSavedUserProducts();\n                      const product = products.find((p) => p.categoryId === categoryId);\n                      if (!product) return;\n                      setEditingManufacturerId(product.manufacturerId);\n                      setFocusProductCategoryId(categoryId);\n                      setProductEditorMode('edit');\n                    }}''')
          replace_once('src/App.tsx', "import { ensureProductsDatabaseInitialized } from './utils/productStorage';", "import { ensureProductsDatabaseInitialized, getSavedUserProducts } from './utils/productStorage';")

          replace_once('src/components/products/AddProductScreen.tsx', "import React, { useState, useMemo } from 'react';", "import React, { useState, useMemo, useEffect } from 'react';")
          replace_once('src/components/products/AddProductScreen.tsx', '''interface AddProductScreenProps {\n  editingManufacturerId?: string | null;\n  onSave: () => void;\n  onBack: () => void;\n}''', '''interface AddProductScreenProps {\n  editingManufacturerId?: string | null;\n  focusProductCategoryId?: string | null;\n  onSave: () => void;\n  onBack: () => void;\n}''')
          replace_once('src/components/products/AddProductScreen.tsx', '''export const AddProductScreen: React.FC<AddProductScreenProps> = ({\n  editingManufacturerId,\n  onSave,\n  onBack,\n}) => {''', '''export const AddProductScreen: React.FC<AddProductScreenProps> = ({\n  editingManufacturerId,\n  focusProductCategoryId,\n  onSave,\n  onBack,\n}) => {''')
          replace_once('src/components/products/AddProductScreen.tsx', '''  // 2. Selected products map (categoryId -> product config)''', '''  useEffect(() => {\n    if (!focusProductCategoryId) return;\n    const timer = window.setTimeout(() => {\n      document.getElementById(`dosage-card-${focusProductCategoryId}`)?.scrollIntoView({\n        behavior: 'smooth',\n        block: 'center',\n      });\n    }, 150);\n    return () => window.clearTimeout(timer);\n  }, [focusProductCategoryId]);\n\n  // 2. Selected products map (categoryId -> product config)''')

          print('SVI SOURCE FIXOVI USPJESNO PRIMIJENJENI.')
          PY

          rm -f .github/workflows/patch-fixes.yml .github/workflows/patch-current-app.yml .github/workflows/patch-liquid-units.yml

      - name: Provjeri TypeScript build
        run: |
          npm install
          npm run build

      - name: Sačuvaj konačne izmjene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/my-pool/PoolFormEditor.tsx src/components/my-pool/MyPoolScreen.tsx src/components/products/MyProductsScreen.tsx src/components/products/AddProductScreen.tsx .github/workflows
          git diff --cached --quiet && { echo "Nema izmjena za commit."; exit 0; }
          git commit -m "Fix pool flow and individual product editing"
          git push
